<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:5173 ws://127.0.0.1:5173" />
    <title>mdv</title>
  </head>
  <body>
    <div id="app">
      <div id="banner" class="banner" hidden></div>
      <div id="doc" hidden>
        <div id="filename" class="filename"></div>
        <div id="frontmatter"></div>
        <div id="content" class="content"></div>
      </div>
      <div id="empty" class="empty">
        <p>Open a markdown file — <kbd>Cmd</kbd><kbd>O</kbd></p>
      </div>
      <div id="toc-rail" class="toc-rail" hidden></div>
      <div id="toc" class="toc" hidden></div>
      <div id="settings" class="settings" hidden>
        <div class="settings-title">Appearance <span class="settings-hint">Cmd+, · Esc closes</span></div>
        <label class="settings-row">
          <span>Body font</span>
          <select id="cfg-fontFamily"></select>
        </label>
        <label class="settings-row">
          <span>Mono font</span>
          <select id="cfg-monoFamily"></select>
        </label>
        <div class="settings-grid">
          <label class="settings-row">
            <span>Size px</span>
            <input type="number" id="cfg-fontSize" min="10" max="28" step="1" />
          </label>
          <label class="settings-row">
            <span>Line height</span>
            <input type="number" id="cfg-lineHeight" min="1.1" max="2.4" step="0.05" />
          </label>
          <label class="settings-row">
            <span>Width ch</span>
            <input type="number" id="cfg-contentWidth" min="50" max="120" step="1" />
          </label>
        </div>
        <div class="settings-footer">
          <span class="settings-note">applies live · saved to ~/.config/mdv/config.json</span>
          <button type="button" id="cfg-reset">Reset</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
